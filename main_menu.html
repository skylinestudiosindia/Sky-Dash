        // High-Performance Game Engine Logic for Universal Screen Fitting

            wrapper: document.getElementById('game-wrapper'),
            init() {
                // Instantly update the viewport to fit any screen smoothly
                this.updateViewport();
                // Listen for window resize to maintain perfect fit without lag
                window.addEventListener('resize', () => this.updateViewport());
            },

            // Universal Screen Fitting Logic (Edge-to-Edge with intelligent cropping)
            updateViewport() {
                const availableHeight = window.innerHeight;
                const availableWidth = window.innerWidth;
                
                // Set a fixed aspect ratio (9:16 portrait) for the game engine
                const gameAspectRatio = 9 / 16;
                let requiredWidth, requiredHeight;

                // Adjust based on portrait or landscape orientation to ensure full edge fit
                if (availableWidth / availableHeight < gameAspectRatio) {
                    // Portrait (Narrow screen) - scale to full width, crop height
                    requiredWidth = availableWidth;
                    requiredHeight = availableWidth / gameAspectRatio;
                } else {
                    // Landscape (Wide screen) - scale to full height, crop width
                    requiredWidth = availableHeight * gameAspectRatio;
                    requiredHeight = availableHeight;
                }

                // Force these dimensions on the game container for zero-lag consistency
                this.wrapper.style.width = requiredWidth + 'px';
                this.wrapper.style.height = requiredHeight + 'px';
            }
        };

        // Navigation function: redirect to the gameplay HTML file smoothly

            // A slight 50ms delay can ensure the tap haptic registers on native devices

        }
