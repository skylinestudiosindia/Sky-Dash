<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Dash - Main Menu</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            height: 100dvh;
            overflow: hidden;
            background-color: #0d1b2a;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Fullscreen Video Background */
        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* Visible/Invisible Overlay Play Area */
        .play-btn-area {
            position: absolute;
            z-index: 10;
            cursor: pointer;
            left: 50%;
            top: 75%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 70px;
            background: linear-gradient(135deg, #ff9f04, #ff5e00);
            border: 3px solid #ffffff;
            border-radius: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
            transition: transform 0.1s ease;
        }
        
        .play-btn-area:active {
            transform: translate(-50%, -50%) scale(0.92);
        }
    </style>
</head>
<body>

    <!-- Autoplay Video Tag -->
    <video class="bg-video" id="menuVideo" autoplay loop muted playsinline preload="auto">
        <source src="menu_bg.mp4" type="video/mp4">
        <source src="VID-20260831-WA6711.mp4" type="video/mp4">
    </video>

    <!-- Play Button -->
    <div class="play-btn-area" id="playBtn" onclick="startGame()">PLAY</div>

    <script>
        const video = document.getElementById('menuVideo');

        // Force Autoplay on Mobile Devices
        function playVideo() {
            if (video) {
                video.play().catch(function(error) {
                    console.log("Autoplay blocked, waiting for touch");
                });
            }
        }

        window.addEventListener('load', playVideo);
        document.addEventListener('touchstart', playVideo, { once: true });
        document.addEventListener('click', playVideo, { once: true });

        function startGame() {
            window.location.href = "game.html";
        }
    </script>

</body>
</html>
