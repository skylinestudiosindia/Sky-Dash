<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Dash - Main Menu</title>
    
    <!-- Ultra-Low Latency Rendering -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Fast Image Preload -->
    <link rel="preload" as="image" href="main_menu.jpg">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: -webkit-fill-available;
            height: 100dvh;
            overflow: hidden;
            background-color: #0d1b2a;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Responsive Main Frame (GPU Accelerated) */
        #game-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 500px;
            margin: 0 auto;
            overflow: hidden;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
        }

        /* Universal Background Image Fitting */
        .bg-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* ----- ANIMATION & SHINE EFFECTS ----- */

        @keyframes pulseBorder {
            0% { transform: scale(1); box-shadow: 0 0 8px rgba(255, 255, 255, 0.3); }
            50% { transform: scale(1.03); box-shadow: 0 0 16px rgba(255, 255, 255, 0.7); }
            100% { transform: scale(1); box-shadow: 0 0 8px rgba(255, 255, 255, 0.3); }
        }

        @keyframes playGlow {
            0% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 15px #ffaa00; }
            50% { transform: scale(1.05); filter: brightness(1.25); box-shadow: 0 0 25px #ffea00; }
            100% { transform: scale(1); filter: brightness(1); box-shadow: 0 0 15px #ffaa00; }
        }

        @keyframes lightSweep {
            0% { left: -120%; }
            40% { left: 140%; }
            100% { left: 140%; }
        }

        /* Button Target Overlay Base Class */
        .btn-target {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            overflow: hidden;
            will-change: transform;
            animation: pulseBorder 2.4s infinite ease-in-out;
        }

        /* Continuous Dynamic Shine Overlay */
        .btn-target::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -120%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.7) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            animation: lightSweep 2.8s infinite ease-in-out;
        }

        /* Touch Instant Response */
        .btn-target:active {
            transform: scale(0.90) !important;
            filter: brightness(1.4);
        }

        /* ----- EXACT IMAGE BUTTON POSITIONS ----- */

        /* Left Column */
        .btn-high-score    { top: 33%; left: 3.5%; width: 20.5%; height: 11.5%; animation-delay: 0s; }
        .btn-missions-left { top: 47%; left: 3.5%; width: 20.5%; height: 11.5%; animation-delay: 0.3s; }
        .btn-daily-reward  { top: 61%; left: 3.5%; width: 20.5%; height: 11.5%; animation-delay: 0.6s; }

        /* Right Column */
        .btn-fuel          { top: 33%; right: 3.5%; width: 20.5%; height: 11.5%; animation-delay: 0.2s; }
        .btn-hangar-right  { top: 47%; right: 3.5%; width: 20.5%; height: 11.5%; animation-delay: 0.5s; }
        .btn-events-right  { top: 61%; right: 3.5%; width: 20.5%; height: 11.5%; animation-delay: 0.8s; }

        /* TAP TO PLAY Button */
        .btn-play {
            top: 76.8%;
            left: 25.5%;
            width: 49%;
            height: 7.2%;
            border-radius: 35px;
            border: 3px solid #ffffff;
            animation: playGlow 1.6s infinite ease-in-out;
        }
        .btn-play::after {
            animation-duration: 2s;
        }

        /* Bottom Navigation Bar */
        .btn-nav-missions { top: 87.2%; left: 3.5%; width: 21%; height: 9.8%; animation-delay: 0.1s; }
        .btn-nav-hangar   { top: 87.2%; left: 27.5%; width: 21%; height: 9.8%; animation-delay: 0.3s; }
        .btn-nav-shop     { top: 87.2%; left: 51.5%; width: 21%; height: 9.8%; animation-delay: 0.5s; }
        .btn-nav-events   { top: 87.2%; left: 75.5%; width: 21%; height: 9.8%; animation-delay: 0.7s; }

    </style>
</head>
<body>

    <div id="game-wrapper">
        <img src="main_menu.jpg" alt="Sky Dash Menu" class="bg-image" fetchpriority="high">

        <!-- Left Column Buttons -->
        <div class="btn-target btn-high-score" onclick="openPopup('High Score')"></div>
        <div class="btn-target btn-missions-left" onclick="openPopup('Missions')"></div>
        <div class="btn-target btn-daily-reward" onclick="openPopup('Daily Reward')"></div>

        <!-- Right Column Buttons -->
        <div class="btn-target btn-fuel" onclick="openPopup('Fuel')"></div>
        <div class="btn-target btn-hangar-right" onclick="openPopup('Hangar')"></div>
        <div class="btn-target btn-events-right" onclick="openPopup('Events')"></div>

        <!-- Play Button -->
        <div class="btn-target btn-play" onclick="startGame()"></div>

        <!-- Bottom Nav Bar -->
        <div class="btn-target btn-nav-missions" onclick="openPopup('Missions')"></div>
        <div class="btn-target btn-nav-hangar" onclick="openPopup('Hangar')"></div>
        <div class="btn-target btn-nav-shop" onclick="openPopup('Shop')"></div>
        <div class="btn-target btn-nav-events" onclick="openPopup('Events')"></div>
    </div>

    <script>
        function startGame() {
            window.location.href = "game.html";
        }

        function openPopup(featureName) {
            alert(featureName + " feature is coming soon!");
        }
    </script>

</body>
</html>
