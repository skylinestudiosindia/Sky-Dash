<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sky Dash - Main Menu</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Arial Black', Impact, sans-serif;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #050d1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Responsive Wrapper */
        .game-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            max-width: 480px;
            overflow: hidden;
            background: linear-gradient(180deg, #1b82d2 0%, #52b69a 65%, #184e77 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            will-change: transform;
            transform: translateZ(0);
        }

        /* Sky Clouds & Sun Effect */
        .sun-glow {
            position: absolute;
            top: -50px;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 70%);
            z-index: 1;
        }

        /* --- TOP BAR (COINS & FUEL) --- */
        .top-bar {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .stat-pill {
            background: rgba(10, 25, 47, 0.75);
            border: 2px solid #3a86ff;
            border-radius: 20px;
            padding: 4px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #fff;
            font-size: 14px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .stat-pill.gold {
            border-color: #ffb703;
            color: #ffb703;
        }

        /* --- LOGO TITLE --- */
        .logo-container {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-top: 5px;
        }

        .logo-title {
            font-size: 38px;
            text-transform: uppercase;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 
                3px 3px 0px #03045e,
                -2px -2px 0px #03045e,
                2px -2px 0px #03045e,
                -2px 2px 0px #03045e,
                0px 6px 12px rgba(0,0,0,0.5);
            background: linear-gradient(180deg, #ffea00 0%, #ff8800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transform: skew(-5deg) rotate(-2deg);
            animation: logoPulse 3s infinite ease-in-out;
        }

        @keyframes logoPulse {
            0%, 100% { transform: skew(-5deg) rotate(-2deg) scale(1); }
            50% { transform: skew(-5deg) rotate(-2deg) scale(1.04); }
        }

        /* --- CENTER HELICOPTER CANVAS / ANIMATION --- */
        .heli-center {
            position: absolute;
            top: 36%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            width: 180px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatHeli 2.5s infinite ease-in-out;
        }

        @keyframes floatHeli {
            0%, 100% { transform: translate(-50%, -50%) translateY(0px) rotate(0deg); }
            50% { transform: translate(-50%, -50%) translateY(-12px) rotate(2deg); }
        }

        /* SVG Cartoon Helicopter */
        .heli-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0px 15px 10px rgba(0,0,0,0.3));
        }

        .blade-spin {
            transform-origin: 90px 35px;
            animation: spinBlade 0.15s linear infinite;
        }

        @keyframes spinBlade {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* --- MIDDLE MAIN GRID (LEFT & RIGHT BUTTONS) --- */
        .main-layout {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            margin-bottom: 10px;
            padding: 0 5px;
        }

        .side-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- SHINY 3D BUTTONS --- */
        .btn-3d {
            position: relative;
            width: 70px;
            height: 65px;
            background: linear-gradient(180deg, #4ea8de 0%, #0077b6 100%);
            border: 2px solid #90e0ef;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            box-shadow: 0 6px 0px #03045e, 0 10px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            will-change: transform;
        }

        /* Dynamic Light Shine Overlay */
        .btn-3d::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -130%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            animation: sweepShine 3s infinite ease-in-out;
        }

        @keyframes sweepShine {
            0% { left: -130%; }
            30%, 100% { left: 140%; }
        }

        .btn-3d:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0px #03045e, 0 4px 8px rgba(0,0,0,0.4);
        }

        .btn-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }

        .btn-text {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px #000;
        }

        /* --- BIG TAP TO PLAY BUTTON --- */
        .play-container {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }

        .btn-play-large {
            width: 82%;
            height: 54px;
            background: linear-gradient(180deg, #ffb703 0%, #fb8500 100%);
            border: 3px solid #fff;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 22px;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px #d45100;
            box-shadow: 0 7px 0px #9d0208, 0 12px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            overflow: hidden;
            position: relative;
            animation: playPulse 1.8s infinite ease-in-out;
        }

        .btn-play-large::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -130%;
            width: 40%;
            height: 200%;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            animation: sweepShine 2.2s infinite ease-in-out;
        }

        @keyframes playPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .btn-play-large:active {
            transform: translateY(5px) scale(0.98) !important;
            box-shadow: 0 2px 0px #9d0208, 0 4px 10px rgba(0,0,0,0.4);
        }

        /* --- BOTTOM NAVIGATION BAR --- */
        .bottom-nav {
            position: relative;
            z-index: 10;
            width: 100%;
            background: rgba(10, 25, 47, 0.85);
            border: 2px solid #1e6091;
            border-radius: 20px;
            padding: 6px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #a2d2ff;
            font-size: 10px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 12px;
            transition: background 0.2s, transform 0.1s;
        }

        .nav-item:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-item .icon {
            font-size: 18px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="game-screen">
        <div class="sun-glow"></div>

        <!-- Top Stat Bar -->
        <div class="top-bar">
            <div class="stat-pill gold">
                <span>🪙</span>
                <span>12,340</span>
            </div>
            <div class="stat-pill">
                <span>⛽</span>
                <span>85/100</span>
            </div>
        </div>

        <!-- Title Header -->
        <div class="logo-container">
            <h1 class="logo-title">Sky Dash</h1>
        </div>

        <!-- Central Animated Vector Helicopter -->
        <div class="heli-center">
            <svg class="heli-svg" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Tail Rotor -->
                <circle cx="20" cy="50" r="14" stroke="#ffb703" stroke-width="4" stroke-dasharray="6 4" />
                <!-- Tail Body -->
                <path d="M20 50 L80 45 L80 60 Z" fill="#d90429" />
                <!-- Main Body -->
                <rect x="70" y="35" width="80" height="45" rx="20" fill="#ffb703" stroke="#d90429" stroke-width="4"/>
                <!-- Cockpit Glass -->
                <path d="M115 38 C140 38, 148 48, 148 65 L115 65 Z" fill="#00b4d8" stroke="#0077b6" stroke-width="3"/>
                <!-- Skids (Legs) -->
                <path d="M75 80 L75 95 M135 80 L135 95 M60 95 L150 95" stroke="#2b2d42" stroke-width="5" stroke-linecap="round"/>
                <!-- Main Blade Mast & Rotor -->
                <rect x="105" y="25" width="8" height="12" fill="#2b2d42"/>
                <g class="blade-spin">
                    <ellipse cx="90" cy="25" rx="85" ry="4" fill="rgba(255,255,255,0.85)"/>
                </g>
            </svg>
        </div>

        <!-- Middle Action Buttons Grid -->
        <div class="main-layout">
            <!-- Left Side Buttons -->
            <div class="side-col">
                <div class="btn-3d" onclick="openPopup('High Score')">
                    <span class="btn-icon">🏆</span>
                    <span class="btn-text">Score</span>
                </div>
                <div class="btn-3d" onclick="openPopup('Missions')">
                    <span class="btn-icon">🎯</span>
                    <span class="btn-text">Missions</span>
                </div>
                <div class="btn-3d" onclick="openPopup('Daily Reward')">
                    <span class="btn-icon">🎁</span>
                    <span class="btn-text">Reward</span>
                </div>
            </div>

            <!-- Right Side Buttons -->
            <div class="side-col">
                <div class="btn-3d" onclick="openPopup('Fuel Shop')">
                    <span class="btn-icon">⛽</span>
                    <span class="btn-text">Fuel</span>
                </div>
                <div class="btn-3d" onclick="openPopup('Hangar')">
                    <span class="btn-icon">🚁</span>
                    <span class="btn-text">Hangar</span>
                </div>
                <div class="btn-3d" onclick="openPopup('Events')">
                    <span class="btn-icon">🌐</span>
                    <span class="btn-text">Events</span>
                </div>
            </div>
        </div>

        <!-- Play Button -->
        <div class="play-container">
            <div class="btn-play-large" onclick="startGame()">
                <span>▶ TAP TO PLAY</span>
            </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-item" onclick="openPopup('Missions')">
                <span class="icon">📋</span>
                <span>Missions</span>
            </div>
            <div class="nav-item" onclick="openPopup('Hangar')">
                <span class="icon">🛸</span>
                <span>Hangar</span>
            </div>
            <div class="nav-item" onclick="openPopup('Shop')">
                <span class="icon">🛒</span>
                <span>Shop</span>
            </div>
            <div class="nav-item" onclick="openPopup('Events')">
                <span class="icon">🏆</span>
                <span>Events</span>
            </div>
        </div>
    </div>

    <script>
        function startGame() {
            window.location.href = "game.html";
        }

        function openPopup(featureName) {
            alert(featureName + " option tapped!");
        }
    </script>

</body>
</html>
